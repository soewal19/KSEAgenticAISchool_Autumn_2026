services:
  postgres:
    image: postgres:16-alpine
    profiles: [db-test]
    environment:
      POSTGRES_DB: air_alerts_test
      POSTGRES_USER: air_alerts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_test_only}
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U air_alerts -d air_alerts_test"]
      interval: 5s
      timeout: 3s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data
