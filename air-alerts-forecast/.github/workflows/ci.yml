name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff pytest

      - name: Lint (ruff)
        run: |
          ruff check src/ tests/ --select E,F,W --ignore E501

      - name: Unit tests
        run: python -m pytest tests/ -v
        env:
          RUN_DB_TESTS: ${{ secrets.RUN_DB_TESTS || 'false' }}
          # Configure TEST_DATABASE_URL as a dedicated Neon branch URL, never production.
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

      - name: Leakage validation (fixed smoke fixture)
        run: python -m src.validate_no_leakage --config config.smoke.yaml

      - name: Docker build
        run: docker build --tag air-alerts-forecast:ci .

      - name: Docker smoke test (fixed smoke fixture)
        run: >-
          docker run --rm air-alerts-forecast:ci sh -c
          'python -m src.pipeline all --config config.smoke.yaml
          && test -s outputs/smoke/metrics/smoke_metrics.json'
